name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compilação, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Disponibilizar cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar resultados dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
