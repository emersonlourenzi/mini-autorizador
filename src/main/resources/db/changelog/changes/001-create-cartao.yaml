databaseChangeLog:
  - changeSet:
      id: 001-create-cartao
      author: mini-autorizador
      changes:
        - createTable:
            tableName: cartao
            columns:
              - column:
                  name: numero_cartao
                  type: varchar(32)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: senha
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: saldo
                  type: decimal(19,2)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: cartao
